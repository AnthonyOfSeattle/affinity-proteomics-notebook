services:
  jupyter:
    build: .
    container_name: affinity-proteomics-notebook
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
    volumes:
      - ./work:/home/jovyan/work
      - ./data:/home/jovyan/data
      - ./results:/home/jovyan/results
    command: start-notebook.sh --NotebookApp.token=''
